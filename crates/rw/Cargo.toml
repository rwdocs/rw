[package]
name = "rw"
description = "Documentation engine - CLI"
repository = "https://github.com/rwdocs/rw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rw"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
embed-assets = ["rw-assets/embed"]

[dependencies]
rw-assets = { workspace = true }
rw-cache = { workspace = true }
rw-storage-s3 = { workspace = true }
rw-config = { workspace = true }
rw-confluence = { workspace = true }
rw-diagrams = { workspace = true }
rw-error = { workspace = true }
rw-server = { workspace = true }
rw-site = { workspace = true }
rw-storage = { workspace = true }
rw-storage-fs = { workspace = true }
axoupdater = { version = "0.10", features = ["blocking"] }
clap = { version = "4", features = ["derive", "env"] }
console = "0.16"
open = "5"
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
rw-comments = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
rw-kroki = { workspace = true, features = ["test-support"] }

pretty_assertions = { workspace = true }

# Depended on only to forward `embed-assets`; no code imports it.
[package.metadata.cargo-shear]
ignored = ["rw-assets"]
