[package]
name = "rw-confluence"
description = "Confluence rendering for RW"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rw-diagrams = { workspace = true }
rw-kroki = { workspace = true }
rw-renderer = { workspace = true }
rw-storage = { workspace = true }

hex = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = "2"
quick-xml = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
rw-error = { workspace = true }
rw-kroki = { workspace = true, features = ["test-support"] }
rw-storage = { workspace = true, features = ["mock"] }
tempfile = { workspace = true }
