[package]
name = "rw-storage-s3"
description = "S3 storage backend and bundle publisher for RW"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rw-diagrams = { workspace = true }
rw-parser = { workspace = true }
rw-plantuml = { workspace = true }
rw-renderer = { workspace = true }
rw-sections = { workspace = true }
rw-storage = { workspace = true }

aws-config = { version = "1", features = ["behavior-version-latest"] }
parking_lot = { workspace = true }
aws-sdk-s3 = { workspace = true }
hex = { workspace = true }
md-5 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
rw-meta = { workspace = true }
rw-storage = { workspace = true, features = ["mock"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
