[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Features to pass to cargo build
features = ["rw/embed-assets"]
# Build each shipped app on its own (`cargo build --package rw`) rather than
# `--workspace`, which is dist's default. Do NOT drop this: rw-napi is a
# cdylib, and cargo refuses to produce one for x86_64-unknown-linux-musl
# ("cannot produce cdylib for ... as the target does not support these crate
# types"), so a workspace-wide build fails on a crate dist never ships. The
# same holds for any future crate that cannot build for every triple in
# `targets` below. Note `cargo check` does not catch this — it downgrades the
# unsupported crate type to a warning; only `cargo build` errors (#747).
precise-builds = true
# Steps to run before building (enables corepack for yarn)
github-build-setup = "../dist/build-setup.yml"
# A GitHub repo to push Homebrew formulas to
tap = "rwdocs/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Local artifacts jobs to run in CI
local-artifacts-jobs = ["./build-npm"]
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-npm"]
# Whether to install an updater program
install-updater = false

# Commit pins for the actions dist writes into release.yml. Renovate ignores
# that file because it is generated, so without these the release path is the
# one place still resolving mutable tags. The versions match what dist 0.32
# generates: it moved the artifact actions but kept checkout on v6.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
