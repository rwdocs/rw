[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Features to pass to cargo build
features = ["rw/embed-assets"]
# Build each shipped app on its own (`cargo build --package rw`) rather than
# `--workspace`, which is dist's default. Do NOT drop this: rw-napi is a
# cdylib, and cargo refuses to produce one for x86_64-unknown-linux-musl
# ("cannot produce cdylib for ... as the target does not support these crate
# types"), so a workspace-wide build fails on a crate dist never ships. The
# same holds for any future crate that cannot build for every triple in
# `targets` below. Note `cargo check` does not catch this — it downgrades the
# unsupported crate type to a warning; only `cargo build` errors (#747).
precise-builds = true
# Steps to run before building (enables corepack for yarn)
github-build-setup = "../dist/build-setup.yml"
# A GitHub repo to push Homebrew formulas to
tap = "rwdocs/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Plan jobs to run in CI. Keep the notice job in this hook: a plan job is the
# only one dist makes the build legs wait on, so any other would race them.
plan-jobs = ["./third-party-notice"]
# Local artifacts jobs to run in CI
local-artifacts-jobs = ["./build-npm"]
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-npm"]
# Whether to install an updater program
install-updater = false
# Third-party notice, assembled by the `github-build-setup` hook above
# (.github/dist/build-setup.yml) before `dist build` runs, from the Rust half
# the plan job produced and the JavaScript half the frontend build wrote.
# Deliberately not committed: it is regenerated fresh for every release build.
include = ["THIRD-PARTY.md"]

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
