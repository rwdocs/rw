# cargo-deny policy. Run `make audit`, or see the `deny` job in
# .github/workflows/ci.yml.
#
# Scope is licenses and sources. Vulnerabilities are Dependabot's job: it
# parses Cargo.lock, so it sees crates that appear in no Cargo.toml — rustls
# via ureq, aws-lc-sys via aws-config — and its database carries advisories
# RustSec's does not.
#
# Both checks below are deterministic: neither can change unless Cargo.lock
# does. So this gates pull requests and needs no scheduled run.

[graph]
# The `publish` and `embed-assets` features pull dependencies that a default
# build does not, and those crates reach shipped binaries too.
all-features = true

[licenses]
# rw ships under MIT OR Apache-2.0, and ships compiled binaries carrying these
# crates three ways: crates.io, prebuilt napi artifacts on npm, and cargo-dist
# release archives. A copyleft dependency reaching one of those is what this
# check exists to catch.
#
# The list is every license currently in the tree, all permissive except the
# MPL-2.0 entry noted below. A new dependency under anything else fails the
# check and gets a deliberate decision.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  # option-ext, pulled in by dirs. Weak copyleft, per-file, and we do not
  # modify it — the obligation does not reach rw's own sources.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
# Everything must come from crates.io. A git or alternate-registry dependency
# would sidestep both this policy and Renovate.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
