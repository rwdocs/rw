name: Audit

# Runs on a schedule as well as per-PR, because the interesting failure is not
# "this PR added a bad crate" — it is "an advisory was published against a
# crate we already ship". Nothing in the repo changes when that happens, so
# only a timed run catches it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, after Renovate's lock file maintenance runs (before 4am UTC), so
    # the audit sees the refreshed lock rather than last week's.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # --hide-inclusion-graph keeps the accepted duplicate-version warnings to
      # one line each. With the graph on, a passing run is ~14k lines and a
      # real advisory would be buried in it. `make audit` leaves the graph on,
      # since that is when you want the tree.
      - name: Audit workspace
        run: cargo deny check --hide-inclusion-graph

      # rw-napi is excluded from the root workspace and resolves its own
      # Cargo.lock, so the workspace audit above does not cover it. It shares
      # the root policy via --config.
      - name: Audit rw-napi
        run: cargo deny --manifest-path crates/rw-napi/Cargo.toml --config deny.toml check --hide-inclusion-graph
