name: Publish npm packages

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-core:
    name: Publish @rwdocs/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Download native artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: npm-native-*
          path: packages/core/artifacts

      - name: Prepare platform packages
        working-directory: packages/core
        run: npx napi artifacts --output-dir artifacts --npm-dir npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          tool: cargo-about@0.9.1

      # Every package published from here ships a compiled .node containing the
      # whole crate tree, so each needs the notice and rw's own licenses beside
      # it. The platform packages carried neither before.
      - name: Generate and distribute third-party notice
        run: |
          cargo about generate --all-features --fail about.hbs > packages/core/THIRD-PARTY-RUST.md
          for dir in packages/core/npm/*/; do
            cp packages/core/THIRD-PARTY-RUST.md "$dir"
            cp LICENSE-MIT LICENSE-APACHE "$dir"
          done

      - name: Publish platform packages
        working-directory: packages/core
        run: |
          for dir in npm/*/; do
            npm publish "$dir" --access public --provenance
          done

      - name: Publish main package
        working-directory: packages/core
        run: npm publish --access public --provenance

  publish-viewer:
    name: Publish @rwdocs/viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Download viewer build
        uses: actions/download-artifact@v8
        with:
          name: npm-viewer
          path: packages/viewer/dist/lib

      - name: Publish
        working-directory: packages/viewer
        run: npm publish --access public --provenance --ignore-scripts
