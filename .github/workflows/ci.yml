name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled job saves no cache, and only main saves them. Main keeps at
  # most one queued run, so a burst of merges still costs one extra run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # Jobs skip with `if:`, not workflow `paths:`, so a skipped job still reports
  # success. Pushes to main and pull requests that change CI run everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      all: ${{ github.event_name == 'push' || steps.filter.outputs.ci == 'true' }}
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
      frontend: ${{ github.event_name == 'push' || steps.filter.outputs.frontend == 'true' }}
      native: ${{ github.event_name == 'push' || steps.filter.outputs.native == 'true' }}
      deps: ${{ github.event_name == 'push' || steps.filter.outputs.deps == 'true' }}
      node-engines: ${{ github.event_name == 'push' || steps.filter.outputs.node-engines == 'true' }}
      viewer-lib: ${{ github.event_name == 'push' || steps.filter.outputs.viewer-lib == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci: &ci
              - .github/**
              - Makefile
            rust:
              - *ci
              - crates/**
              - "**/*.rs"
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
            frontend:
              - *ci
              - packages/**
              - package.json
              - package-lock.json
            # The napi CLI version in package-lock.json shapes the generated bindings.
            native:
              - *ci
              - crates/**
              - packages/core/**
              - Cargo.toml
              - Cargo.lock
              - rust-toolchain.toml
              - package.json
              - package-lock.json
            deps:
              - *ci
              - "**/Cargo.toml"
              - Cargo.lock
              - deny.toml
              - about.toml
              - about.hbs
            node-engines:
              - *ci
              - package.json
              - packages/*/package.json
              - package-lock.json
            viewer-lib:
              - *ci
              - packages/viewer/**
              - package.json
              - package-lock.json

  node-engine-floor:
    name: Node engine floor (${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.node-engines == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.22.2", "24.15.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies with engine enforcement
        run: npm ci
        env:
          npm_config_engine_strict: "true"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No argument: installs the toolchain rust-toolchain.toml names.
      - name: Install Rust
        run: rustup toolchain install

      # A PR's cache serves only that PR, yet counts against the repo's 10 GB
      # and evicts the main caches every PR restores from.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          # Pinned so a cargo-shear release that detects more cannot fail CI
          # with no rw change. Newer versions are missing from this
          # install-action's manifest and would fall back to cargo-binstall.
          tool: cargo-shear@1.13.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: make lint

      # Only release builds enable this feature, and rust-embed needs the
      # bundle on disk to compile it.
      - name: Build frontend bundle
        run: npm -w @rwdocs/viewer run build

      - name: Clippy with embedded assets
        run: cargo clippy -p rw-assets --all-targets --features embed -- -D warnings

  deny:
    name: Dependency policy
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # cargo-deny builds its graph by shelling out to `cargo metadata`.
      - name: Install Rust
        run: rustup toolchain install

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          # Pinned: cargo-deny changes check defaults across releases, so a
          # float would let a cargo-deny release fail CI with no rw change.
          # cargo-about is pinned for the same reason.
          tool: cargo-deny@0.20.2,cargo-about@0.9.1

      # Licenses and sources only — advisories are Dependabot's. Both are a
      # pure function of Cargo.lock, so this never fails a PR that did not
      # touch dependencies.
      - name: Check licenses and sources
        run: cargo deny check licenses sources

      # The release build generates a third-party notice from this same config.
      # Running it here means an unresolvable license fails the pull request
      # that introduces the dependency, rather than the next release.
      - name: Third-party notice resolves
        run: cargo about generate --all-features --fail about.hbs > /dev/null

  # A job per OS rather than a matrix, because a job's `if:` cannot read `matrix`.
  test-ubuntu:
    name: Test (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm -w @rwdocs/viewer run build

      - name: Run Rust tests
        run: cargo test --all-targets

      # `--all-targets` excludes doctests.
      - name: Run Rust doctests
        if: runner.os == 'Linux'
        run: cargo test --doc --workspace

      # jsdom runs browser code; the host OS changes nothing but speed.
      - name: Run frontend tests
        if: runner.os == 'Linux'
        run: npm -w @rwdocs/viewer run test

  test-windows:
    name: Test (windows-latest)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps: *test-steps

  # After merge only: the Free plan runs at most five macOS jobs at a time.
  test-macos:
    name: Test (macos-latest)
    needs: changes
    if: needs.changes.outputs.all == 'true'
    runs-on: macos-latest
    steps: *test-steps

  e2e:
    name: E2E Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build CLI
        run: cargo build -p rw

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/viewer

      - name: Run E2E tests
        run: npm -w @rwdocs/viewer run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: packages/viewer/playwright-report/
          retention-days: 7

  native-bindings:
    name: Native bindings
    needs: changes
    if: needs.changes.outputs.native == 'true' || needs.changes.outputs.viewer-lib == 'true'
    uses: ./.github/workflows/build-npm.yml
    with:
      native: ${{ needs.changes.outputs.native == 'true' }}
      all-targets: ${{ needs.changes.outputs.all == 'true' }}
      viewer: ${{ needs.changes.outputs.viewer-lib == 'true' }}
