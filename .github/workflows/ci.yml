name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm -w @rwdocs/viewer run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The publisher resolves PlantUML includes through rw-plantuml so that a
      # binary that only publishes never links the diagram renderer. Nothing in
      # the type system enforces that; a stray `use rw_kroki::…` would restore
      # the dependency silently. The tree is captured first so a `cargo tree`
      # failure fails the step instead of satisfying the negation.
      - name: publish feature stays free of the diagram renderer
        run: |
          tree=$(cargo tree -p rw-storage-s3 --features publish -e normal)
          ! grep -q rw-kroki <<< "$tree"

      - name: Run svelte-check
        run: npm -w @rwdocs/viewer run check

      # Mirrors the `make lint` target so the layer-boundary and Tailwind-token
      # rules are enforced here and not only when someone runs it by hand.
      - name: Run ESLint
        run: npm -w @rwdocs/viewer run lint

      - name: Run ESLint (workspace root)
        run: npm run lint

      - name: Check Prettier formatting
        run: npx -w @rwdocs/viewer prettier --check .

      - name: Check Prettier formatting (workspace root)
        run: npx prettier --check .

      # Finds what a per-file linter cannot: exports nothing imports, files
      # nothing reaches, dependencies nothing resolves.
      - name: Run knip
        run: npm run knip

      # Lints the packed tarball. Nothing above reaches it: tsc and svelte-check
      # read source, never the `exports` map or the emitted `.d.ts`. The rows the
      # output marks ignored are not suppressed defects — the package is ESM, so
      # "CommonJS consumers need a dynamic import" describes it accurately.
      - name: Check published package
        run: npm -w @rwdocs/viewer run check:pack

  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo-deny builds its graph by shelling out to `cargo metadata`, so the
      # job needs a toolchain of its own rather than whichever one the runner
      # image happens to ship. rust-toolchain.toml pins the version actually
      # used, here as everywhere else.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        with:
          # Pinned: cargo-deny changes check defaults across releases, so a
          # float would let a cargo-deny release fail CI with no rw change.
          # cargo-about is pinned for the same reason.
          tool: cargo-deny@0.20.2,cargo-about@0.9.1

      # Licenses and sources only — advisories are Dependabot's. Both are a
      # pure function of Cargo.lock, so this never fails a PR that did not
      # touch dependencies.
      - name: Check licenses and sources
        run: cargo deny check licenses sources

      # The release build generates a third-party notice from this same config.
      # Running it here means an unresolvable license fails the pull request
      # that introduces the dependency, rather than the next release.
      - name: Third-party notice resolves
        run: cargo about generate --all-features --fail about.hbs > /dev/null

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm -w @rwdocs/viewer run build

      - name: Run Rust tests
        run: cargo test --all-targets

      - name: Run frontend tests
        run: npm -w @rwdocs/viewer run test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend bundle
        run: npm -w @rwdocs/viewer run build

      - name: Build CLI
        run: cargo build -p rw

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/viewer

      - name: Run E2E tests
        run: npm -w @rwdocs/viewer run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/viewer/playwright-report/
          retention-days: 7

  native-bindings:
    name: Native bindings
    uses: ./.github/workflows/build-npm.yml
