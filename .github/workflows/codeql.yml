name: CodeQL

# Replaces CodeQL default setup, which must stay disabled: GitHub rejects
# uploads from this workflow while default setup is on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  # Every push to main runs: each one analyzes only what its own commit
  # changed, so a run replaced while pending would leave that change unscanned.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changes
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      actions: ${{ steps.filter.outputs.actions }}
      javascript: ${{ steps.filter.outputs.javascript }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      # Pull requests list their files through the API; a push diffs in git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'push'
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            self: &self
              - .github/workflows/codeql.yml
            actions:
              - .github/**
            javascript:
              - *self
              - packages/**
              - "**/*.{js,mjs,cjs,ts,mts,cts}"
              - package.json
              - package-lock.json
            rust:
              - *self
              - crates/**
              - "**/*.rs"
              - Cargo.toml
              - Cargo.lock

  # One job per language rather than a matrix, because a job's `if:` cannot
  # read `matrix`. The names match the ones default setup used.
  actions:
    name: Analyze (actions)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.actions == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      LANGUAGE: actions
    steps: &analyze
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ env.LANGUAGE }}
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ env.LANGUAGE }}

  javascript:
    name: Analyze (javascript-typescript)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || needs.changes.outputs.javascript == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      LANGUAGE: javascript-typescript
    steps: *analyze

  # The slowest analysis, and so far it has raised only path-injection alerts
  # on paths rw serves by design, so pull requests skip it.
  rust:
    name: Analyze (rust)
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'pull_request' && (needs.changes.result == 'skipped' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      LANGUAGE: rust
    steps: *analyze
