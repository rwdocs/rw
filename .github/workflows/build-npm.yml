name: Build npm packages

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string
      # The release passes none of these, so it always builds everything.
      native:
        description: Build and test the native addon.
        type: boolean
        default: true
      all-targets:
        description: Build every native target, not only x86_64-unknown-linux-gnu.
        type: boolean
        default: true
      viewer:
        description: Build the viewer library.
        type: boolean
        default: true

# A called workflow can only narrow what the caller granted, so this also caps
# the release workflow's `contents: write` at read for the duration of the build.
permissions:
  contents: read

jobs:
  # `all-targets` gates whole jobs because a matrix `include` entry cannot be
  # excluded. Pull requests build only this target; it runs the
  # generated-bindings check.
  build-native:
    if: inputs.native
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            build: npm -w @rwdocs/core run build -- --target x86_64-unknown-linux-gnu -- --locked
    name: Build native - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps: &build-native-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # The release skips the cache, so nothing a CI run saved can reach a
      # published binary.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: inputs.plan == ''
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          tool: cargo-zigbuild
          fallback: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: ${{ matrix.build }}

      # Tests and publishing use the checked-in loader/types; only binaries are uploaded.
      - name: Check generated bindings
        run: git diff --exit-code -- packages/core/index.js packages/core/index.d.ts

      # test-native covers the Linux targets in their own containers.
      - name: Test binding
        if: matrix.target == 'aarch64-apple-darwin'
        run: npm -w @rwdocs/core test

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-native-${{ matrix.target }}
          path: packages/core/*.node
          if-no-files-found: error

  build-native-extra:
    if: inputs.native && inputs.all-targets
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            build: npm -w @rwdocs/core run build -- --target aarch64-apple-darwin -- --locked
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build: npm -w @rwdocs/core run build -- --target x86_64-unknown-linux-musl -x -- --locked
    name: Build native - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps: *build-native-steps

  test-native:
    name: Test native - ${{ matrix.target }}
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            image: node:22.23.3-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    runs-on: ubuntu-latest
    steps: &test-native-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-native-${{ matrix.target }}
          path: packages/core/

      - name: Test binding
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: ${{ matrix.image }}
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: node --test packages/core/test/*.test.mjs

  test-native-extra:
    name: Test native - ${{ matrix.target }}
    needs: build-native-extra
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            image: node:22.23.3-alpine3.24@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
    runs-on: ubuntu-latest
    steps: *test-native-steps

  build-viewer:
    name: Build viewer library
    if: inputs.viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm -w @rwdocs/viewer run build:lib

      # The notice reaches the package through the `dist/lib/` directory entry
      # in `files`, not by being named there. Assert it, because a change to
      # that entry would drop the notice silently.
      - name: Viewer package includes its third-party notice
        run: |
          npm pack -w @rwdocs/viewer --dry-run --json \
            | grep -q 'dist/lib/THIRD-PARTY-JS.md'

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-viewer
          path: packages/viewer/dist/lib/
          if-no-files-found: error
