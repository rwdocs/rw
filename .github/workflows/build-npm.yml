name: Build npm packages

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string

# A called workflow can only narrow what the caller granted, so this also caps
# the release workflow's `contents: write` at read for the duration of the build.
permissions:
  contents: read

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            build: npm -w @rwdocs/core run build -- --target aarch64-apple-darwin -- --locked
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            build: npm -w @rwdocs/core run build -- --target x86_64-unknown-linux-gnu -- --locked
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build: npm -w @rwdocs/core run build -- --target x86_64-unknown-linux-musl -x -- --locked
    name: Build native - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
        if: ${{ contains(matrix.target, 'musl') }}
        with:
          tool: cargo-zigbuild

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: ${{ matrix.build }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-native-${{ matrix.target }}
          path: packages/core/*.node
          if-no-files-found: error

  test-native:
    name: Test native - ${{ matrix.target }}
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            image: node:22-slim
          - target: x86_64-unknown-linux-musl
            image: node:22-alpine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: npm-native-${{ matrix.target }}
          path: packages/core/

      - name: Test binding
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: ${{ matrix.image }}
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: node --test packages/core/test/*.test.mjs

  build-viewer:
    name: Build viewer library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm -w @rwdocs/viewer run build:lib

      # The notice reaches the package through the `dist/lib/` directory entry
      # in `files`, not by being named there. Assert it, because a change to
      # that entry would drop the notice silently.
      - name: Viewer package includes its third-party notice
        run: |
          npm pack -w @rwdocs/viewer --dry-run --json \
            | grep -q 'dist/lib/THIRD-PARTY-JS.md'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: npm-viewer
          path: packages/viewer/dist/lib/
          if-no-files-found: error
