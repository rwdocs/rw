- name: Build frontend
  run: npm ci && npm -w @rwdocs/viewer run build

- name: Install cargo-about
  uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2
  with:
    tool: cargo-about@0.9.1

# The archive carries one notice covering everything inside the binary. The
# Rust half comes from Cargo.lock; the JavaScript half was written into the
# viewer bundle by the build above, and is embedded in the binary as well.
- name: Generate third-party notice
  # Force bash: the default shell on the windows-msvc matrix leg is pwsh,
  # where `cat A B > C` resolves to Get-Content and fails binding two
  # positional paths to its single positional parameter. pwsh also only
  # surfaces the LAST statement's exit code, so a failing `cargo about
  # generate` would go unnoticed once `rm` succeeds after it.
  shell: bash
  run: |
    cargo about generate --all-features --fail about.hbs > THIRD-PARTY-RUST.md
    cat THIRD-PARTY-RUST.md packages/viewer/dist/THIRD-PARTY-JS.md > THIRD-PARTY.md
    rm THIRD-PARTY-RUST.md
